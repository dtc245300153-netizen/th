<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký người dùng</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #edf3ff;
        margin: 0;
        padding: 40px 15px;
        color: #243247;
      }

      .form-box {
        max-width: 500px;
        margin: auto;
        padding: 30px;
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 5px 20px #ccd5e3;
      }

      h2 {
        text-align: center;
        color: #174ea6;
        margin-bottom: 25px;
      }

      .field {
        margin-bottom: 20px;
      }

      .field > label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccd5e3;
        border-radius: 7px;
        box-sizing: border-box;
        font-size: 15px;
      }

      input:focus {
        outline: 2px solid #bfdbfe;
        border-color: #2563eb;
      }

      .gender label {
        margin-right: 15px;
        font-weight: normal;
      }

      .gender input {
        accent-color: #2563eb;
      }

      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 25px;
      }

      button {
        padding: 12px 18px;
        border: none;
        border-radius: 7px;
        cursor: pointer;
        font-size: 15px;
      }

      .submit {
        background-color: #2563eb;
        color: white;
        flex: 1;
      }

      .reset {
        background-color: #e5e7eb;
        color: #243247;
      }

      button:hover {
        opacity: 0.85;
      }

      @media (max-width: 480px) {
        .form-box {
          padding: 20px;
        }

        .buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>

  <body>
    <div class="form-box">
      <h2>Đăng ký người dùng</h2>

      <form
        action="http://demo.codegym.vn/6/registration_form/register.php"
        method="POST"
      >
        <div class="field">
          <label for="name">Họ và tên</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Nhập họ và tên"
            required
          />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Nhập địa chỉ email"
            required
          />
        </div>

        <div class="field">
          <label for="phone">Số điện thoại</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="Nhập số điện thoại"
            required
          />
        </div>

        <div class="field">
          <label>Giới tính</label>

          <div class="gender">
            <label>
              <input type="radio" name="gender" value="Nam" required />
              Nam
            </label>

            <label>
              <input type="radio" name="gender" value="Nữ" />
              Nữ
            </label>

            <label>
              <input type="radio" name="gender" value="Khác" />
              Khác
            </label>
          </div>
        </div>

        <div class="buttons">
          <button type="submit" class="submit">Đăng ký</button>

          <button type="reset" class="reset">Nhập lại</button>
        </div>
      </form>
    </div>
  </body>
</html>
